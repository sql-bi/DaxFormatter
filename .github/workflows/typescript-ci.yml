name: typescript-ci

on:
  pull_request:
    branches: [master]
    paths:
      - typescript/**
      - .github/workflows/typescript-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/packages/daxformatter-mcp/package-lock.json

      - name: install
        working-directory: typescript/packages/daxformatter-mcp
        run: npm ci

      - name: typecheck
        working-directory: typescript/packages/daxformatter-mcp
        run: npm run typecheck

      - name: build
        working-directory: typescript/packages/daxformatter-mcp
        run: npm run build

      - name: test
        working-directory: typescript/packages/daxformatter-mcp
        run: npm test
