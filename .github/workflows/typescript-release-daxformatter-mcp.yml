name: typescript-release-daxformatter-mcp

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and run every check, but skip npm publish and only print the GitHub release command
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max # a new run waits instead of canceling a pending one

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create github release
      id-token: write # npm provenance
    steps:
      - name: check branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Releases run only from refs/heads/master, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning and git describe need full history
          persist-credentials: false

      # No npm cache: a release installs only what the lock file names, from the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: install
        working-directory: typescript/packages/daxformatter-mcp
        run: npm ci

      # The nbgv CLI of the nerdbank-gitversioning package, the one that stamps package.json,
      # so the tag can't differ from the published version. It runs on the runner's .NET.
      - name: read version
        id: version
        working-directory: typescript/packages/daxformatter-mcp
        run: |
          version=$(npx --no nbgv get-version --variable NpmPackageVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails if this version is already tagged. The notes start from the nearest
      # tag of this package, new or legacy form (DaxFormatter_MCP_v<version>), so
      # the legacy tags count until the first daxformatter-mcp-v tag. Runs in a
      # dry run too.
      - name: read tags
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="daxformatter-mcp-v$VERSION"
          if [ -n "$(git tag --list "$tag")" ]; then
            echo "::error::Tag $tag already exists, so this version is already released"
            exit 1
          fi
          if ! previous=$(git describe --tags --abbrev=0 --match 'daxformatter-mcp-v*' --match 'DaxFormatter_MCP_v*'); then
            echo "::error::No previous daxformatter-mcp-v* or DaxFormatter_MCP_v* tag reachable from this commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"
          echo "Previous tag: $previous"

      - name: build
        working-directory: typescript/packages/daxformatter-mcp
        run: npm run build

      - name: test
        working-directory: typescript/packages/daxformatter-mcp
        run: npm test

      - name: set version
        working-directory: typescript/packages/daxformatter-mcp
        run: npx --no nbgv-setversion

      # npm pack --dry-run lists what npm publish would upload, without network or credentials.
      - name: list package contents
        if: ${{ inputs.dry_run }}
        working-directory: typescript/packages/daxformatter-mcp
        run: npm pack --dry-run

      - name: publish
        if: ${{ !inputs.dry_run }}
        working-directory: typescript/packages/daxformatter-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # A draft, so a maintainer removes the other packages' pull requests from the notes.
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous }}
        run: |
          release_args=(release create "$TAG" --title "$TAG" --target "$GITHUB_SHA"
            --generate-notes --notes-start-tag "$PREVIOUS_TAG"
            --prerelease --latest=false --draft)
          command="gh ${release_args[*]}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run, would run: $command"
          else
            echo "$command"
            gh "${release_args[@]}"
          fi
