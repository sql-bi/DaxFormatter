name: ci-mcp

on:
  pull_request:
    branches: [master]
    paths:
      - mcp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: install
        working-directory: mcp
        run: npm ci

      - name: typecheck
        working-directory: mcp
        run: npm run typecheck

      - name: build
        working-directory: mcp
        run: npm run build

      - name: test
        working-directory: mcp
        run: npm test
