name: dotnet-release-dax-formatter

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test, pack and run every check, but skip nuget push and only print the GitHub release command
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max # a new run waits instead of canceling a pending one

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create github release
      id-token: write # nuget.org Trusted Publishing
    defaults:
      run:
        working-directory: dotnet
    steps:
      # Runs before checkout, so it can't start in dotnet/.
      - name: check branch
        working-directory: .
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            Write-Output "::error::Releases run only from refs/heads/master, not $env:GITHUB_REF"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning and git describe need full history
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: dotnet/global.json

      # The Nerdbank.GitVersioning MSBuild task, the one that stamps the package,
      # so the pushed file and the tag can't differ from the packed version.
      - name: read version
        id: version
        run: |
          $version = dotnet msbuild ./src/Dax.Formatter/Dax.Formatter.csproj -restore -target:GetBuildVersion -getProperty:NuGetPackageVersion
          if ($LASTEXITCODE -ne 0) { $version; exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Fails if this version is already tagged. The notes start from the nearest
      # tag of this package, new or legacy form (v<version>), so the legacy tags
      # count until the first Dax.Formatter-v tag. Runs in a dry run too.
      - name: read tags
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "Dax.Formatter-v$env:VERSION"
          if (git tag --list $tag) {
            Write-Output "::error::Tag $tag already exists, so this version is already released"
            exit 1
          }
          $previous = git describe --tags --abbrev=0 --match 'Dax.Formatter-v*' --match 'v[0-9]*'
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::No previous Dax.Formatter-v* or v[0-9]* tag reachable from this commit"
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "previous=$previous" >> $env:GITHUB_OUTPUT
          Write-Output "Tag: $tag"
          Write-Output "Previous tag: $previous"

      - name: restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          $bytes = [Convert]::FromBase64String("$env:SIGNING_KEY")
          if ($bytes.Length -eq 0) {
            Write-Output "::error::The SIGNING_KEY secret is missing or empty"
            exit 1
          }
          [IO.File]::WriteAllBytes("src/Dax.Formatter/DaxFormatter.snk", $bytes)

      - name: build
        run: dotnet build ./Dax.Formatter.sln --configuration Release

      - name: test
        run: dotnet test ./tests/Dax.Formatter.Tests/Dax.Formatter.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: pack
        run: dotnet pack ./src/Dax.Formatter/Dax.Formatter.csproj --configuration Release --no-build --output ./artifacts

      # Runs in a dry run too, so that a dry run checks the Trusted Publishing policy.
      - name: nuget login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: nuget push
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet nuget push "./artifacts/Dax.Formatter.$env:VERSION.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      # A draft, so a maintainer removes the other packages' pull requests from the notes.
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:TAG,
            '--title', "DaxFormatter v$env:VERSION",
            '--target', $env:GITHUB_SHA,
            '--generate-notes', '--notes-start-tag', $env:PREVIOUS_TAG,
            '--latest', '--draft'
          )
          $command = 'gh ' + (($releaseArgs -replace '.*\s.*', '"$0"') -join ' ')
          if ($env:DRY_RUN -eq 'true') {
            Write-Output "Dry run, would run: $command"
          } else {
            Write-Output $command
            gh @releaseArgs
          }
