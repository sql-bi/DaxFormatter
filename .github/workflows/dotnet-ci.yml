name: ci

on:
  pull_request:
    branches: [master]
    paths:
      - dotnet/**
      - .github/workflows/dotnet-ci.yml
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json

      - name: build
        run: dotnet build ./Dax.Formatter.sln --configuration Release

      - name: test
        run: dotnet test ./tests/Dax.Formatter.Tests/Dax.Formatter.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: pack
        run: dotnet pack ./src/Dax.Formatter/Dax.Formatter.csproj --configuration Release --no-build
