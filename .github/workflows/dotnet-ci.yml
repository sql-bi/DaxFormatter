name: dotnet-ci

on:
  push:
    branches: [master]
    paths:
      - dotnet/**
      - .github/workflows/dotnet-ci.yml
  pull_request:
    branches: [master]
    paths:
      - dotnet/**
      - .github/workflows/dotnet-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: dotnet/global.json

      - name: build
        run: dotnet build ./Dax.Formatter.sln --configuration Release

      - name: test
        run: dotnet test ./tests/Dax.Formatter.Tests/Dax.Formatter.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: pack
        run: dotnet pack ./src/Dax.Formatter/Dax.Formatter.csproj --configuration Release --no-build
