version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/dotnet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    assignees:
    - "albertospelta"
    ignore:
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "xunit"
      - dependency-name: "xunit.runner.visualstudio"
      - dependency-name: "coverlet.collector"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    assignees:
    - "albertospelta"

  - package-ecosystem: "npm"
    directory: "/typescript/packages/daxformatter-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    assignees:
    - "albertospelta"
    groups:
      dev-dependencies:
        dependency-type: "development"